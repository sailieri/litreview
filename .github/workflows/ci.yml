name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法编译（全部 .py）
        run: |
          python -m compileall -q modules webapp pipelines tools

      - name: 模块导入冒烟（不联网、不建库）
        run: |
          python - <<'PY'
          import glob, importlib, os, sys
          sys.path.insert(0, os.getcwd())
          bad = []
          for path in sorted(glob.glob("modules/**/*.py", recursive=True)):
              if os.path.basename(path).startswith("__"):
                  continue
              mod = path[:-3].replace(os.sep, ".").replace("/", ".")
              try:
                  importlib.import_module(mod)
              except Exception as exc:
                  bad.append((mod, type(exc).__name__, str(exc)[:120]))
          print(f"导入 {len(glob.glob('modules/**/*.py', recursive=True))} 个模块，失败 {len(bad)}")
          for item in bad:
              print("  FAIL", item)
          sys.exit(1 if bad else 0)
          PY

      - name: 入口 --help 冒烟
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys
          targets = sorted(glob.glob("tools/**/*.py", recursive=True)) + \
                    sorted(glob.glob("pipelines/**/*.py", recursive=True))
          skip = {"webapp/server.py", "webapp/mcp_server.py"}
          bad = []
          ran = 0
          for path in targets:
              if path in skip or os.path.basename(path).startswith("__"):
                  continue
              src = open(path, encoding="utf-8", errors="replace").read()
              if "argparse" not in src:
                  continue
              ran += 1
              r = subprocess.run([sys.executable, path, "--help"],
                                 capture_output=True, text=True, timeout=120)
              if r.returncode != 0:
                  bad.append((path, r.returncode, (r.stderr or r.stdout)[-160:].strip()))
          print(f"带 argparse 的入口 {ran} 个，失败 {len(bad)}")
          for item in bad:
              print("  FAIL", item)
          sys.exit(1 if bad else 0)
          PY

      - name: 空库 schema 冒烟
        run: |
          python - <<'PY'
          import os, sys, tempfile
          sys.path.insert(0, os.getcwd())
          os.environ["LITREVIEW_DATA"] = tempfile.mkdtemp()
          from modules.database.schema import get_db, init_db
          c = get_db()
          init_db(c)
          cols = {r[1] for r in c.execute("PRAGMA table_info(papers)")}
          need = {"summary", "deleted_at"}
          assert need <= cols, f"papers 缺列: {sorted(need - cols)}"
          tabs = {r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          for t in ("entities_merged", "papers", "chunks", "collections"):
              assert t in tabs, f"缺表: {t}"
          print(f"空库 schema OK：{len(tabs)} 张表，papers 列 {len(cols)} 个")
          PY

      - name: webapp 接口冒烟（空库 + 一篇种子数据）
        run: |
          DATA_ROOT="$(mktemp -d)"
          echo "LITREVIEW_DATA=$DATA_ROOT" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          from modules.database.schema import get_db, init_db
          c = get_db()
          init_db(c)
          c.execute("INSERT INTO papers(title,authors,year,journal,doi,file_path) "
                    "VALUES('Smoke paper','A',2024,'J','','x.pdf')")
          c.commit()
          print("种子数据 ok")
          PY
          cd webapp
          python -m uvicorn server:app --host 127.0.0.1 --port 8799 > /tmp/webapp.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8799/api/stats && break
            sleep 1
          done
          fail=0
          for ep in /api/stats /api/papers /api/papers/1 /api/ingest/overview \
                    /api/ingest/items /api/ingest/jobs /api/insights /api/facets \
                    /api/collections /api/agent/threads /api/models/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "http://127.0.0.1:8799$ep")
            echo "$ep -> $code"
            [ "$code" -lt 400 ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then echo "::error::接口冒烟失败"; tail -40 /tmp/webapp.log; exit 1; fi

      - name: 敏感信息扫描（仅跟踪文件）
        run: |
          set -e
          if git grep -nIE "sk-[A-Za-z0-9]{20,}" -- '*.py' '*.md' '*.yaml' '*.yml' '*.example'; then
            echo "::error::发现疑似 API 密钥"; exit 1
          fi
          if git grep -nIE "[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{4,5}" -- '*.py' '*.md' | grep -vE "127\.0\.0\.1|0\.0\.0\.0|localhost|example\.(com|org)"; then
            echo "::error::发现疑似内网/主机地址"; exit 1
          fi
          echo "未发现密钥或内网地址"
